# Example only. Change the root to the folder containing website/index.html.
# Retain your existing HTTPS/certificate configuration or add HTTPS with Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name pinkout.asem.work;
    root /var/www/pinkout;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/ld+json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /index.html { return 301 /; }
    location = /en/index.html { return 301 /en/; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Short cache because file names are editable and not content-hashed.
    location ~* \.(css|js|woff2|webp|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
